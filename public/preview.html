<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<title>作成 — md-slides</title>
<meta name="viewport" content="width=1440" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&family=Noto+Sans+JP:wght@400;700&family=Noto+Serif+JP:wght@400;700&family=M+PLUS+Rounded+1c:wght@400;700&family=BIZ+UDPGothic:wght@400;700&family=Klee+One:wght@400;600&family=LINE+Seed+Sans+JP:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* =========================================================
   md-slides — Material 3 風 (オリジナル / 非 Google ブランド)
   ========================================================= */
:root{
  --p-0:#000000; --p-10:#001a41; --p-20:#002e6e; --p-30:#00429b;
  --p-40:#0b57d0; --p-50:#3270e2; --p-60:#5c8bef; --p-70:#7fa5f5;
  --p-80:#a7c2ff; --p-90:#d6e2ff; --p-95:#ecf0ff; --p-99:#fdfbff; --p-100:#ffffff;
  --s-30:#3a4a6a; --s-40:#54647f; --s-80:#bfc8e0; --s-90:#dbe2f9; --s-95:#eef0fb;
  --n-0:#000; --n-6:#101113; --n-10:#1b1b1f; --n-20:#303033; --n-30:#46464a;
  --n-40:#5e5e62; --n-50:#77777a; --n-60:#909094; --n-70:#abaaaf; --n-80:#c7c6ca;
  --n-90:#e3e2e6; --n-94:#edecf0; --n-95:#f2f0f4; --n-96:#f5f3f7; --n-98:#faf8fc; --n-100:#fff;
  --nv-30:#454654; --nv-50:#76778b; --nv-80:#c5c6dd; --nv-90:#e1e2f9;
  --err-40:#ba1a1a; --err-90:#ffdad6;
  --primary: var(--p-40); --on-primary: var(--p-100); --primary-container: var(--p-90); --on-primary-container: var(--p-10);
  --surface: var(--n-98); --surface-dim: var(--n-90); --surface-bright: var(--n-100);
  --surface-container-lowest: var(--n-100); --surface-container-low: var(--n-96); --surface-container: var(--n-94);
  --surface-container-high: #e8e6ec; --surface-container-highest: #e1dfe4;
  --on-surface: var(--n-10); --on-surface-variant: var(--nv-30); --outline: var(--nv-50); --outline-variant: var(--nv-80);
  --elev-1: 0 1px 2px rgba(0,0,0,.10), 0 1px 3px 1px rgba(0,0,0,.06);
  --elev-2: 0 1px 2px rgba(0,0,0,.10), 0 2px 6px 2px rgba(0,0,0,.08);
  --elev-3: 0 1px 3px rgba(0,0,0,.10), 0 4px 8px 3px rgba(0,0,0,.08);
  --elev-4: 0 2px 3px rgba(0,0,0,.10), 0 6px 10px 4px rgba(0,0,0,.10);
  --elev-5: 0 4px 4px rgba(0,0,0,.10), 0 8px 12px 6px rgba(0,0,0,.10);
  --r-xs:4px; --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:28px; --r-full:9999px;
  --font-sans: "Roboto","Helvetica Neue",system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono: "Roboto Mono","SF Mono",ui-monospace,Menlo,Consolas,monospace;
  --easing-emph: cubic-bezier(.2,0,0,1); --easing-std: cubic-bezier(.2,0,0,1);
}
*,*::before,*::after{ box-sizing: border-box; }
html,body{ margin:0; padding:0; height:100%; overflow:hidden; background: var(--surface); color: var(--on-surface); font-family: var(--font-sans); font-size:14px; -webkit-font-smoothing: antialiased; }
button{ font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
select,input,textarea{ font: inherit; color: inherit; }
::selection{ background: var(--p-90); color: var(--p-10); }

.app{ display:grid; grid-template-rows: 64px 1fr 28px; height:100vh; min-width: 1280px; }

/* --- 1. Top app bar --- */
.appbar{ display:flex; align-items:center; gap:16px; padding: 0 16px 0 12px; background: var(--surface-container); border-bottom: 1px solid var(--outline-variant); position:relative; z-index: 4; }
.appbar .brand{ display:flex; align-items:center; gap:12px; padding: 6px 10px 6px 8px; border-radius: var(--r-full); text-decoration:none; }
.brand-mark{ width: 32px; height: 32px; border-radius: 8px; background: var(--p-40); display:grid; place-items:center; color: #fff; font-weight:700; font-size: 16px; letter-spacing:-.02em; }
.brand-wm{ font-weight:500; font-size: 20px; letter-spacing:-.01em; color: var(--on-surface); }
.brand-wm em{ font-style: normal; color: var(--on-surface); font-weight:700; }
.appbar .grow{ flex:1; }
.status-pill{ display:inline-flex; align-items:center; gap:8px; height: 28px; padding: 0 12px; color: var(--on-surface-variant); font-size: 12px; max-width: 460px; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.status-pill .dot{ width:6px; height:6px; border-radius:50%; background: var(--on-surface-variant); opacity:.6; flex-shrink:0; }
.status-pill.err{ color: var(--err-40); } .status-pill.err .dot{ background: var(--err-40); opacity:1; }
.status-pill.warn{ color:#8a5a00; } .status-pill.warn .dot{ background:#e08600; opacity:1; }
.icon-btn{ width: 40px; height: 40px; border-radius: var(--r-full); display:inline-grid; place-items:center; color: var(--on-surface-variant); transition: background .15s var(--easing-std); position: relative; }
.icon-btn:hover{ background: rgba(0,0,0,.06); color: var(--on-surface); }
.icon-btn:active{ background: rgba(0,0,0,.10); }
.icon-btn svg{ width:22px; height:22px; }
.btn-tonal{ display:inline-flex; align-items:center; gap:8px; height: 40px; padding: 0 16px 0 14px; border-radius: var(--r-full); background: var(--p-90); color: var(--p-10); font-weight:500; font-size:14px; transition: background .15s, box-shadow .15s; }
.btn-tonal:hover{ background: #c4d6ff; box-shadow: var(--elev-1); }
.btn-tonal svg{ width:18px; height:18px; }
.btn-filled{ display:inline-flex; align-items:center; gap:10px; height: 44px; padding: 0 22px 0 18px; border-radius: var(--r-full); background: var(--primary); color: var(--on-primary); font-weight:500; font-size:15px; box-shadow: var(--elev-1); transition: box-shadow .15s, background .15s; }
.btn-filled:hover{ background: #0b4dba; box-shadow: var(--elev-3); }
.btn-filled svg{ width:20px; height:20px; }
.btn-outlined{ display:inline-flex; align-items:center; gap:8px; height: 36px; padding: 0 16px; border-radius: var(--r-full); border: 1px solid var(--outline); color: var(--on-surface-variant); font-weight:500; font-size:13px; background: transparent; }
.btn-outlined:hover{ background: rgba(0,0,0,.04); color: var(--on-surface); }
.divider-v{ width:1px; height: 28px; background: var(--outline-variant); margin: 0 4px; }

/* --- 2. Formatting toolbar (floating, contextual) --- */
.fmtbar{ position: fixed; display:flex; align-items:center; gap: 6px; padding: 6px 10px; background: var(--surface-container-lowest); border: 1px solid var(--outline-variant); border-radius: var(--r-full); box-shadow: var(--elev-3); z-index: 6; overflow: visible; transform-origin: 50% 100%; transform: translateY(8px) scale(.96); opacity: 0; pointer-events: none; transition: transform .18s var(--easing-emph), opacity .14s var(--easing-std); white-space: nowrap; top:0; left:0; }
.fmtbar.is-visible{ opacity: 1; pointer-events: auto; transform: translateY(0) scale(1); }
.fmtbar .divider-v{ height: 22px; margin: 0 2px; }
.fmtbar .group{ display:flex; align-items:center; gap: 2px; }
.fmtbar .group-label{ font-size: 11px; color: var(--on-surface-variant); padding: 0 4px 0 6px; }

/* Empty-state hint on the stage */
.select-hint{ position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); display: inline-flex; align-items:center; gap: 8px; background: var(--surface-container-high); color: var(--on-surface-variant); font-size: 12px; padding: 8px 14px; border-radius: var(--r-full); box-shadow: var(--elev-1); pointer-events: none; transition: opacity .2s; }
.select-hint svg{ width: 14px; height: 14px; }
.stage.has-selection .select-hint{ opacity: 0; }

.tgl{ height: 34px; min-width: 34px; padding: 0 8px; border-radius: var(--r-full); display:inline-flex; align-items:center; justify-content:center; gap:6px; color: var(--on-surface-variant); transition: background .15s, color .15s; font-weight: 500; font-size: 13px; }
.tgl:hover{ background: rgba(0,0,0,.05); color: var(--on-surface); }
.tgl.is-on{ background: var(--p-90); color: var(--p-10); }
.tgl.is-on:hover{ background: #c4d6ff; }
.tgl:disabled{ opacity:.4; cursor:default; } .tgl:disabled:hover{ background:none; }
.tgl svg{ width: 20px; height: 20px; }
.i-bold{ font-weight: 800; font-size: 16px; line-height: 1; }

.seg{ display:inline-flex; border: 1px solid var(--outline); border-radius: var(--r-full); background: var(--surface-container-low); height: 32px; overflow: hidden; }
.seg .seg-btn{ min-width: 36px; height: 100%; padding: 0 8px; display:inline-flex; align-items:center; justify-content:center; color: var(--on-surface-variant); border-right: 1px solid var(--outline); transition: background .15s; font-size: 11px; }
.seg .seg-btn:last-child{ border-right: 0; }
.seg .seg-btn:hover{ background: rgba(0,0,0,.05); }
.seg .seg-btn.is-on{ background: var(--s-90); color: var(--p-10); }
.seg .seg-btn:disabled{ opacity:.4; cursor:default; }
.seg .seg-btn svg{ width: 16px; height: 16px; }

.stepper{ display:inline-flex; align-items:center; height: 32px; border:1px solid var(--outline); border-radius: var(--r-full); padding: 0 4px; background: var(--surface-container-low); }
.stepper button{ width: 26px; height: 26px; border-radius:50%; color: var(--on-surface-variant); }
.stepper button:hover{ background: rgba(0,0,0,.06); }
.stepper .val{ min-width: 28px; text-align:center; font-variant-numeric: tabular-nums; font-weight:500; color: var(--on-surface); }
.stepper .unit{ font-size:11px; color: var(--on-surface-variant); margin-left:2px; }

.color-trigger{ display:inline-flex; align-items:center; gap:6px; height: 32px; padding: 0 8px; border-radius: var(--r-full); border:1px solid var(--outline); background: var(--surface-container-low); color: var(--on-surface-variant); font-size:13px; font-weight:500; }
.color-trigger:hover{ background: rgba(0,0,0,.04); }
.color-trigger > svg{ width: 18px; height: 18px; color: var(--on-surface-variant); }
.color-trigger .chip{ width: 16px; height: 16px; border-radius: 4px; background: #1b1b1f; border: 1px solid rgba(0,0,0,.15); }
.color-trigger svg.caret{ width: 16px; height: 16px; color: var(--on-surface-variant); }
.color-pop{ position: absolute; top: 100%; margin-top: 6px; left: 0; background: var(--surface-container-low); border-radius: var(--r-md); padding: 12px; box-shadow: var(--elev-3); border: 1px solid var(--outline-variant); z-index: 8; display: none; width: 240px; }
.color-pop.is-open{ display:block; }
.color-pop h4{ margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--on-surface-variant); font-weight: 500; }
.color-pop .row{ display:grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-bottom: 12px; }
.color-pop .row:last-child{ margin-bottom: 0; }
.sw{ width: 100%; aspect-ratio: 1/1; border-radius: 8px; cursor: pointer; border: 1px solid rgba(0,0,0,.08); transition: transform .12s, box-shadow .12s; }
.sw:hover{ transform: scale(1.08); box-shadow: var(--elev-1); }
.sw.is-on{ outline: 2px solid var(--primary); outline-offset: 2px; }
.color-pop .custom{ display:flex; gap:8px; align-items:center; margin-top: 10px; padding-top:10px; border-top:1px solid var(--outline-variant); }
.color-pop .custom input[type="color"]{ width: 30px; height: 30px; border:0; padding:0; background:none; border-radius: 8px; cursor:pointer; }
.color-pop .custom label{ font-size: 12px; color: var(--on-surface-variant); }
.color-pop .custom button{ margin-left:auto; font-size:12px; color: var(--primary); font-weight:500; padding:4px 8px; border-radius:var(--r-sm); }
.color-pop .custom button:hover{ background: rgba(11,87,208,.08); }

.field{ position: relative; height: 32px; border:1px solid var(--outline); border-radius: var(--r-sm); background: var(--surface-container-lowest); padding: 0 10px; display:inline-flex; align-items:center; gap:6px; }
.field:hover{ border-color: var(--on-surface-variant); }
.field:focus-within{ border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); }
.field select{ appearance: none; background: transparent; border: 0; outline: none; height: 100%; padding-right: 22px; font-size: 12px; min-width: 110px; }
.field .caret{ position:absolute; right:8px; top:50%; transform:translateY(-50%); width: 16px; height: 16px; color: var(--on-surface-variant); pointer-events:none; }

.chip{ display:inline-flex; align-items:center; gap:6px; height: 28px; padding: 0 10px; border-radius: var(--r-sm); border: 1px solid var(--outline); background: var(--surface-container-lowest); font-size: 11.5px; color: var(--on-surface-variant); font-weight: 500; }
.chip.is-on{ background: var(--p-90); color: var(--p-10); border-color: transparent; }
.chip svg{ width:16px; height:16px; }

/* --- 3. Main canvas layout --- */
.main{ display: grid; grid-template-columns: minmax(360px, 28%) minmax(0, 1fr); min-height: 0; background: var(--surface); }
.pane-edit{ display:flex; flex-direction: column; border-right: 1px solid var(--outline-variant); background: var(--surface-container-lowest); }
.pane-head{ display:flex; align-items:center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--outline-variant); color: var(--on-surface-variant); font-size: 12px; font-weight: 500; letter-spacing: .04em; text-transform: uppercase; }
.pane-head svg{ width:16px; height:16px; }
.pane-head .spacer{ flex:1; }
.pane-head .lines{ font-variant-numeric: tabular-nums; color: var(--n-50); font-weight: 400; text-transform: none; letter-spacing: 0; }
.editor-wrap{ position: relative; flex: 1; min-height: 0; background: var(--n-100); }
.md-highlight, #md{ position:absolute; inset:0; margin:0; width:100%; height:100%; box-sizing:border-box; padding: 18px 18px 24px; font-family: var(--font-mono); font-size: 13.5px; line-height: 1.7; tab-size: 2; white-space: pre-wrap; overflow-wrap: break-word; word-break: break-word; scrollbar-gutter: stable; }
.md-highlight{ color: transparent; overflow: hidden; pointer-events: none; }
.md-highlight mark{ background: #d6e2ff; color: transparent; border-radius: 2px; }
#md{ border: 0; outline: none; resize: none; color: var(--n-10); background: transparent; overflow-y: auto; }

.pane-prev{ display:grid; grid-template-rows: 1fr 168px; grid-template-columns: minmax(0, 1fr); min-height: 0; min-width: 0; background: var(--surface); }
.stage{ position: relative; display:flex; align-items:center; justify-content:center; padding: 28px 40px 20px; min-height: 0; min-width: 0; background: var(--surface); }
#slides{ min-width: 0; max-width: 100%; }
.stage .badge{ position: absolute; top: 16px; left: 28px; font-size: 12px; color: var(--on-surface-variant); font-weight: 400; font-variant-numeric: tabular-nums; }
.stage .badge .num-pill{ color: var(--on-surface); font-weight: 500; }
.stage .stage-tools{ position: absolute; top: 14px; right: 24px; display:flex; gap: 4px; }
.stage .hint{ position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--on-surface-variant); background: var(--surface-container-high); padding: 4px 12px; border-radius: var(--r-full); opacity: 0; transition: opacity .2s; pointer-events: none; white-space:nowrap; }
.stage.editing .hint{ opacity: 1; }
.slide-card{ aspect-ratio: 16/9; width: min(100%, calc((100vh - 64px - 28px - 168px - 60px) * 16/9)); background: #fff; border-radius: var(--r-lg); box-shadow: var(--elev-3); position: relative; overflow: hidden; outline: 2px solid transparent; transition: outline-color .2s; }
.slide-card.is-active{ outline-color: var(--p-40); }
.slide-card svg{ width: 100%; height: 100%; display:block; }
.slide-card.overflow{ outline-color: var(--err-40); }
#slides{ width:100%; display:flex; justify-content:center; align-items:center; }
.slide .num{ display:none; }

.filmstrip{ display:flex; align-items:center; gap: 4px; padding: 12px 14px 16px; background: var(--surface-container-low); border-top: 1px solid var(--outline-variant); position: relative; }
.filmstrip .nav{ width: 36px; height: 36px; border-radius:50%; display:grid; place-items:center; background: var(--surface-container-highest); color: var(--on-surface-variant); box-shadow: var(--elev-1); flex-shrink:0; }
.filmstrip .nav:hover{ background: var(--p-90); color: var(--p-10); }
.filmstrip .nav svg{ width:18px; height:18px; }
.thumbs{ flex: 1; min-width: 0; display:flex; align-items:center; gap: 12px; overflow-x: auto; overflow-y: hidden; scroll-behavior: smooth; padding: 6px 6px 10px; }
.thumbs::-webkit-scrollbar{ height: 10px; }
.thumbs::-webkit-scrollbar-track{ background: transparent; }
.thumbs::-webkit-scrollbar-thumb{ background: var(--n-80); border-radius: 999px; border: 3px solid var(--surface-container-low); }
.thumbs::-webkit-scrollbar-thumb:hover{ background: var(--n-70); }
.thumb{ flex: 0 0 auto; width: 176px; aspect-ratio: 16/9; background: #fff; border: 1px solid var(--outline-variant); border-radius: var(--r-sm); box-shadow: var(--elev-1); cursor: pointer; position: relative; overflow: hidden; transition: box-shadow .15s, border-color .15s; }
.thumb:hover{ box-shadow: var(--elev-2); border-color: var(--outline); }
.thumb.is-active{ border-color: var(--p-40); box-shadow: inset 0 0 0 2px var(--p-40), var(--elev-1); }
.thumb-num{ position: absolute; top: 6px; left: 6px; width: 22px; height: 22px; border-radius: 50%; background: rgba(0,0,0,.55); color: #fff; display:grid; place-items:center; font-size: 11px; font-weight: 500; z-index:1; }
.thumb.is-active .thumb-num{ background: var(--p-40); }
.thumb svg{ width:100%; height:100%; display:block; }

/* --- 4. Bottom status bar --- */
.statusbar{ display:flex; align-items:center; gap: 16px; padding: 0 16px; background: var(--surface-container); border-top: 1px solid var(--outline-variant); font-size: 11.5px; color: var(--on-surface-variant); }
.statusbar .grow{ flex: 1; }
.statusbar .sb-item{ display:inline-flex; align-items:center; gap:6px; }

/* --- Settings side sheet --- */
.scrim{ position: fixed; inset: 0; background: rgba(0,0,0,.32); opacity: 0; pointer-events: none; transition: opacity .25s var(--easing-std); z-index: 9; }
.scrim.is-open{ opacity: 1; pointer-events: auto; }
.sheet{ position: fixed; top: 0; right: 0; height: 100%; width: 460px; background: var(--surface-container-low); box-shadow: var(--elev-5); transform: translateX(110%); transition: transform .35s var(--easing-emph); z-index: 10; display:flex; flex-direction: column; border-left: 1px solid var(--outline-variant); }
.sheet.is-open{ transform: translateX(0); }
.sheet-head{ display:flex; align-items:center; gap: 10px; padding: 16px 14px 16px 20px; border-bottom: 1px solid var(--outline-variant); }
.sheet-head h2{ margin: 0; font-size: 20px; font-weight: 500; letter-spacing:-.01em; flex:1; color: var(--n-10); }
.sheet-body{ flex: 1; overflow-y: auto; padding: 8px 0 32px; }
.sect{ padding: 20px 24px; border-bottom: 1px solid var(--outline-variant); }
.sect:last-child{ border-bottom: 0; }
.sect h3{ margin: 0 0 14px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--n-30); }
.sect p{ margin: 0 0 12px; font-size: 13px; color: var(--n-30); line-height: 1.6; }
.row{ display:flex; align-items:center; gap: 16px; padding: 10px 0; }
.row .label{ flex: 1; font-size: 15px; font-weight: 500; color: var(--n-10); }
.row .desc{ font-size: 13px; color: var(--n-30); margin-top: 3px; line-height: 1.5; }
.switch{ position: relative; width: 52px; height: 32px; border-radius: 16px; background: var(--surface-container-highest); border: 2px solid var(--n-40); cursor: pointer; transition: background .2s, border-color .2s; flex-shrink: 0; }
.switch::after{ content:""; position: absolute; top: 50%; left: 5px; transform: translate(0, -50%); width: 16px; height: 16px; border-radius: 50%; background: var(--n-40); transition: transform .2s var(--easing-emph), background .2s, width .2s, height .2s; }
.switch.is-on{ background: var(--p-40); border-color: var(--p-40); }
.switch.is-on::after{ background: #fff; width: 22px; height: 22px; transform: translate(22px, -50%); }
.btn-danger{ display:inline-flex; align-items:center; gap:8px; height: 40px; padding: 0 18px; border-radius: var(--r-full); background: var(--err-90); color: var(--err-40); font-weight: 500; font-size: 14px; white-space: nowrap; flex-shrink: 0; }
.btn-danger:hover{ background: #ffc4be; }

/* --- Preview slide internals (JS contract) --- */
.bhit{ fill: transparent; cursor: pointer; pointer-events: all; }
.ehit{ fill: transparent; pointer-events: none; }
.blk:not(.charmode):hover .bhit{ fill: rgba(11,87,208,.05); }
.blk.charmode .ehit{ pointer-events: all; cursor: move; stroke: #0a8754; stroke-width: 0.8; stroke-dasharray: 2 2; }
.blk.charmode .ehit:hover{ fill: rgba(10,135,84,.08); }
.legacy-hidden{ display: none !important; }
</style>
</head>

<!-- Inline SVG icon symbols -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

<div class="app">
  <!-- APP BAR -->
  <header class="appbar">
    <a class="brand" href="/" title="トップへ">
      <div class="brand-mark">m</div>
      <div class="brand-wm"><em>md</em>-slides</div>
    </a>
    <div class="grow"></div>
    <button id="undo" class="icon-btn" title="元に戻す (⌘Z)"><svg><use href="#i-undo"/></svg></button>
    <button id="redo" class="icon-btn" title="やり直し (⌘Y / ⌘⇧Z)"><svg><use href="#i-redo"/></svg></button>
    <button id="openSettings" class="icon-btn" title="設定"><svg><use href="#i-settings"/></svg></button>
    <div class="divider-v"></div>
    <button id="dl" class="btn-filled" title="編集できる .pptx をダウンロード"><svg><use href="#i-download"/></svg>ダウンロード</button>
  </header>

  <!-- FORMAT BAR (contextual, floating) -->
  <nav id="fmtbar" class="fmtbar" aria-label="書式ツールバー" role="toolbar">
    <div class="group">
      <button id="fmtBold" class="tgl" title="太字"><span class="i-bold">B</span></button>
      <div style="position:relative">
        <button id="fmtColorBtn" class="color-trigger" title="文字色" aria-haspopup="true">
          <svg><use href="#i-text-color"/></svg>
          <span id="fmtColorChip" class="chip" style="border-radius:4px;width:16px;height:16px;padding:0;background:#1b1b1f;border:1px solid rgba(0,0,0,.15)"></span>
          <svg class="caret"><use href="#i-caret-down"/></svg>
        </button>
        <input id="fmtColor" type="color" value="#000000" style="position:absolute;width:0;height:0;opacity:0;pointer-events:none" />
        <div id="fmtColorPop" class="color-pop" role="dialog">
          <h4>標準カラー</h4>
          <div id="cpStd" class="row"></div>
          <h4>グレー階調</h4>
          <div id="cpGray" class="row"></div>
          <div class="custom">
            <label for="customPick">カスタム</label>
            <input id="customPick" type="color" value="#000000" />
            <button id="fmtClsClear" title="色なし(既定)に戻す">色なし</button>
          </div>
        </div>
      </div>
      <div class="stepper" title="文字サイズ">
        <button id="fmtSizeDown" aria-label="小さく"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M5 11h14v2H5z"/></svg></button>
        <span id="fmtSizeVal" class="val">–</span><span class="unit">pt</span>
        <button id="fmtSizeUp" aria-label="大きく"><svg width="16" height="16" viewBox="0 0 24 24"><path fill="currentColor" d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
      </div>
      <div class="field">
        <select id="fontSel" aria-label="フォント" title="この要素のフォント">
          <option value="">既定</option>
          <option value="Noto Sans JP">Noto Sans</option>
          <option value="LINE Seed Sans JP">LINE Seed</option>
          <option value="UD デジタル教科書体 N-R, BIZ UDPGothic">UD 教科書体</option>
          <option value="Yu Gothic, YuGothic, Noto Sans JP">游ゴシック</option>
          <option value="Yu Mincho, YuMincho, Noto Serif JP">游明朝</option>
          <option value="Meiryo, Noto Sans JP">メイリオ</option>
          <option value="MS Gothic, MS ゴシック, ＭＳ ゴシック, Noto Sans JP">MS ゴシック</option>
          <option value="Hiragino Kaku Gothic ProN, Hiragino Sans, Noto Sans JP">ヒラギノ角ゴ</option>
          <option value="Hiragino Mincho ProN, Noto Serif JP">ヒラギノ明朝</option>
          <option value="Noto Serif JP">明朝</option>
          <option value="M PLUS Rounded 1c">丸ゴシック</option>
          <option value="Klee One">筆書き</option>
        </select>
        <svg class="caret"><use href="#i-caret-down"/></svg>
      </div>
    </div>
    <div class="divider-v"></div>
    <div class="group"><button id="fmtRole" class="chip is-on" title="ブロックの役割"><svg><use href="#i-style"/></svg><span id="fmtRoleLabel">本文</span></button></div>
    <div class="divider-v"></div>
    <div class="group">
      <span class="group-label">登場</span>
      <div class="seg" role="group" aria-label="登場アニメ方向">
        <button id="animLeft"  class="seg-btn" title="左から"><svg><use href="#i-arrow-left"/></svg></button>
        <button id="animUp"    class="seg-btn" title="上から"><svg><use href="#i-arrow-up"/></svg></button>
        <button id="animDown"  class="seg-btn" title="下から"><svg><use href="#i-arrow-down"/></svg></button>
        <button id="animRight" class="seg-btn" title="右から"><svg><use href="#i-arrow-right"/></svg></button>
        <button id="animNone"  class="seg-btn" title="なし"><svg><use href="#i-none"/></svg></button>
      </div>
    </div>
  </nav>

  <!-- MAIN -->
  <main class="main">
    <section class="pane-edit" aria-label="Markdown エディタ">
      <div class="pane-head"><svg><use href="#i-edit-doc"/></svg>Markdown<span class="spacer"></span><span class="lines" id="mdLines"></span></div>
      <div class="editor-wrap">
        <div id="mdHighlight" class="md-highlight" aria-hidden="true"></div>
        <textarea id="md" spellcheck="false"></textarea>
      </div>
    </section>

    <section class="pane-prev">
      <div class="stage" id="stage">
        <div class="badge"><span class="num-pill" id="badgeNum">–</span> / <span id="badgeTotal">–</span></div>
        <div id="slides"></div>
        <div class="hint" id="editHint"></div>
      </div>
      <div class="filmstrip">
        <button class="nav" id="filmPrev" title="前へ"><svg><use href="#i-chevron-left"/></svg></button>
        <div class="thumbs" id="thumbs"></div>
        <button class="nav" id="filmNext" title="次へ"><svg><use href="#i-chevron-right"/></svg></button>
      </div>
    </section>
  </main>

  <!-- STATUS BAR -->
  <footer class="statusbar">
    <span class="status-pill" id="status"><span class="dot"></span><span id="statusText">読み込み中…</span></span>
    <span class="grow"></span>
    <span class="sb-item" id="sbSlides">–</span>
    <span class="sb-item" id="sbLines">–</span>
  </footer>
</div>

<!-- SETTINGS SHEET -->
<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" aria-label="設定">
  <div class="sheet-head">
    <button class="icon-btn" id="closeSettings" title="閉じる"><svg><use href="#i-close"/></svg></button>
    <h2>設定</h2>
  </div>
  <div class="sheet-body">
    <div class="sect">
      <h3>フォント</h3>
      <div class="row">
        <div><div class="label">既定のフォント</div><div class="desc">すべてのスライドの本文に使う書体</div></div>
        <div class="field" style="height:38px">
          <select id="setDefaultFont">
            <option value="">Noto Sans JP（既定）</option>
            <option value="LINE Seed Sans JP">LINE Seed Sans JP</option>
            <option value="UD デジタル教科書体 N-R, BIZ UDPGothic">UD 教科書体（Windows搭載／他は BIZ UDPGothic）</option>
            <option value="Yu Gothic, YuGothic, Noto Sans JP">游ゴシック（Windows/Mac）</option>
            <option value="Yu Mincho, YuMincho, Noto Serif JP">游明朝（Windows/Mac）</option>
            <option value="Meiryo, Noto Sans JP">メイリオ（Windows）</option>
            <option value="MS Gothic, MS ゴシック, ＭＳ ゴシック, Noto Sans JP">MS ゴシック（Windows）</option>
            <option value="Hiragino Kaku Gothic ProN, Hiragino Sans, Noto Sans JP">ヒラギノ角ゴ（Mac）</option>
            <option value="Hiragino Mincho ProN, Noto Serif JP">ヒラギノ明朝（Mac）</option>
            <option value="Noto Serif JP">Noto Serif JP（明朝）</option>
            <option value="M PLUS Rounded 1c">M PLUS Rounded 1c（丸ゴシック）</option>
            <option value="Klee One">Klee One（筆書き）</option>
          </select>
          <svg class="caret"><use href="#i-caret-down"/></svg>
        </div>
      </div>
    </div>
    <div class="sect">
      <h3>アニメーション</h3>
      <div class="row">
        <div><div class="label">登場アニメ</div><div class="desc">オンにすると要素が左から順に表示されます。向きはツールバーで個別に変更できます。</div></div>
        <div class="switch is-on" id="setAnim" role="switch" aria-checked="true"></div>
      </div>
    </div>
    <div class="sect">
      <h3>下書きを生成</h3>
      <p>この記法をコピーして ChatGPT や Claude に貼ると、md-slides 用の下書き（Markdown）を作れます。</p>
      <textarea id="llmSpec" spellcheck="false" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none" aria-hidden="true"></textarea>
      <div style="display:flex;gap:8px;margin-top:4px;justify-content:flex-end">
        <button id="copyLlm" class="btn-tonal"><svg><use href="#i-copy"/></svg>記法をコピー</button>
      </div>
    </div>
    <div class="sect">
      <h3>リセット</h3>
      <div class="row" style="padding-top:0">
        <div><div class="label">すべて初期化</div><div class="desc">全スライドの位置・色・サイズ・登場アニメを元に戻します</div></div>
        <button id="resetAll" class="btn-danger">初期化</button>
      </div>
    </div>
  </div>
</aside>

<!-- LEGACY HIDDEN (JS contract) -->
<div class="legacy-hidden">
  <div id="missingBar"></div>
  <div id="qrOverlay"><div id="qrCode"></div><div id="qrCount"></div><ul id="qrMissingList"></ul><input id="qrUrl" /><button id="qrDone"></button><button id="qrSkip"></button></div>
</div>

<script type="module" src="/js/preview.js?v=mat1"></script>
</body>
</html>
