<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>作成 — Tegaki Slides</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif; color: #222; background: #f0f0f3; }
  header { background: #fff; border-bottom: 1px solid #ddd; padding: 0.6rem 1rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 1.05rem; margin: 0; font-weight: 600; }
  header .sp { flex: 1; }
  header a { color: #06c; text-decoration: none; font-size: 0.9rem; }
  .tbtn { padding: 0.4em 0.8em; background: #eee; color: #333; border: 1px solid #ccc; border-radius: 6px; cursor: pointer; font-size: 0.85rem; }
  .tbtn:hover { background: #e0e0e0; }
  /* 当たり判定: ブロック=矩形領域 / 文字=charmode時のみ */
  .bhit { pointer-events: all; cursor: move; }
  .blk:not(.charmode):hover .bhit { fill: rgba(0,100,255,0.05) !important; }
  .ehit { pointer-events: none; cursor: move; }
  .blk.charmode .ehit { pointer-events: all; stroke: #0a0; stroke-width: 0.8; stroke-dasharray: 2 2; }
  .blk.charmode .ehit:hover { fill: rgba(0,160,0,0.08) !important; }
  .wrap { display: flex; gap: 1rem; padding: 1rem; align-items: flex-start; }
  .left { width: 38%; min-width: 320px; position: sticky; top: 56px; }
  textarea { width: 100%; height: 70vh; font-family: ui-monospace, Menlo, monospace; font-size: 13px; padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; resize: vertical; }
  .right { flex: 1; }
  .slide { background: #fff; border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,.1); margin-bottom: 1rem; padding: 0.5rem; }
  .slide.overflow { box-shadow: 0 0 0 2px #dc2626, 0 1px 4px rgba(0,0,0,.1); }
  .slide .num { font-size: 0.75rem; color: #888; margin: 0.1rem 0 0.3rem 0.4rem; }
  .slide .ovwarn { color: #dc2626; font-weight: 600; margin-left: 0.5rem; }
  .slide svg { max-width: 100%; height: auto; display: block; }
  .fmtbar { position: sticky; top: 56px; z-index: 4; background:#fff; border:1px solid #ddd; border-radius:8px; padding:0.4rem 0.6rem; margin-bottom:0.6rem; display:flex; align-items:center; gap:0.35rem; flex-wrap:wrap; box-shadow:0 1px 4px rgba(0,0,0,.08); font-size:0.85rem; }
  .fmtbar .fbtn { border:1px solid #cbd5e1; background:#f8fafc; border-radius:6px; padding:0.18rem 0.55rem; cursor:pointer; font-size:0.85rem; line-height:1.4; }
  .fmtbar .fbtn:hover { background:#eef2ff; }
  .fmtbar .fbtn.active { background:#2563eb; color:#fff; border-color:#2563eb; }
  .fmtbar .fmt-label { color:#666; }
  .fmtbar .fmt-sep { width:1px; height:18px; background:#e2e8f0; margin:0 0.25rem; }
  .fmtbar .fmt-role { font-weight:600; }
  .fmtbar .fmt-colorwrap { position:relative; display:inline-flex; }
  .fmtbar #fmtColorBtn { display:inline-flex; align-items:center; gap:5px; }
  .fmtbar .cp-chip { width:13px; height:13px; border:1px solid #aaa; border-radius:2px; background:#000; display:inline-block; }
  .color-pop { position:absolute; top:calc(100% + 4px); left:0; z-index:20; background:#fff; border:1px solid #cbd5e1; border-radius:8px; box-shadow:0 6px 20px rgba(0,0,0,.18); padding:0.6rem; width:max-content; }
  .color-pop .cp-sec { font-size:0.72rem; color:#666; margin:0.15rem 0 0.3rem; }
  .color-pop .cp-grid { display:grid; grid-template-columns:repeat(10,17px); gap:4px; margin-bottom:0.4rem; }
  .color-pop .cp-grid.gray { grid-template-columns:repeat(6,17px); }
  .color-pop .sw { width:17px; height:17px; border:1px solid #ccc; border-radius:3px; cursor:pointer; padding:0; }
  .color-pop .sw.active { outline:2px solid #2563eb; outline-offset:1px; }
  .color-pop .cp-foot { display:flex; align-items:center; justify-content:space-between; gap:0.6rem; margin-top:0.35rem; border-top:1px solid #eee; padding-top:0.5rem; }
  .color-pop .cp-custom { font-size:0.78rem; color:#444; display:inline-flex; align-items:center; gap:5px; }
  .color-pop .cp-custom input[type=color] { width:28px; height:22px; padding:0; border:1px solid #cbd5e1; border-radius:5px; cursor:pointer; }
  .status { padding: 0.4rem 0.6rem; border-radius: 6px; font-size: 0.85rem; margin-bottom: 0.5rem; }
  .status.err { background: #fee; color: #900; white-space: pre-wrap; }
  .status.warn { background: #fff8e1; color: #875; }
  .status.ok { background: #e8f8e8; color: #060; }
  .hint { font-size: 0.8rem; color: #888; margin-top: 0.4rem; }
  /* 未登録文字バー */
  .missing-bar { background: #fff3e0; border: 1px solid #ffcc80; color: #8a5a00; border-radius: 6px; padding: 0.5rem 0.7rem; margin-bottom: 0.5rem; font-size: 0.88rem; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .missing-bar .mchars { font-weight: 700; font-size: 1.05rem; letter-spacing: 0.08em; word-break: break-all; }
  .missing-bar .sp { flex: 1; }
  .missing-bar button { padding: 0.35em 0.8em; background: #06c; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.82rem; white-space: nowrap; }
  /* QR 全画面オーバーレイ */
  .qr-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.62); display: flex; align-items: center; justify-content: center; z-index: 50; }
  .qr-card { background: #fff; border-radius: 14px; padding: 1.3rem 1.5rem 1.5rem; max-width: 460px; width: 92%; text-align: center; box-shadow: 0 10px 44px rgba(0,0,0,.35); }
  .qr-card h2 { margin: 0.1rem 0 0.5rem; font-size: 1.15rem; }
  .qr-missing { font-size: 0.9rem; color: #444; margin: 0.2rem 0 0.5rem; }
  .qr-missing .mchars { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.1em; word-break: break-all; color: #b00; }
  .qr-img { width: 256px; height: 256px; margin: 0.6rem auto; border: 1px solid #eee; }
  .qr-help { font-size: 0.8rem; color: #666; line-height: 1.55; margin: 0.5rem 0 0; }
  .qr-url { font-size: 0.72rem; color: #06c; word-break: break-all; margin-top: 0.4rem; }
  .qr-btns { display: flex; gap: 0.6rem; justify-content: center; margin-top: 0.9rem; }
  .qr-btns button { padding: 0.5em 1em; border-radius: 8px; border: 1px solid #ccc; background: #eee; color: #333; cursor: pointer; font-size: 0.9rem; }
  .qr-btns .qr-primary { background: #06c; color: #fff; border: none; font-weight: 600; }
  /* ブランド / ナビ */
  .brand { display: flex; align-items: center; gap: 0.5rem; text-decoration: none; flex-shrink: 0; }
  .brand img { height: 26px; display: block; }
  header nav { display: flex; gap: 0.1rem; }
  header nav a { font-size: 0.88rem; padding: 0.3rem 0.65rem; border-radius: 6px; color: #333; text-decoration: none; }
  header nav a:hover { background: #f3f4f6; }
  header nav a.active { background: #eef2ff; color: #2563eb; font-weight: 600; }
  .tbtn.active { background: #eef2ff; border-color: #9db4f5; color: #2563eb; }
  /* LLM 記法ルール */
  .llm-section { max-width: 1100px; margin: 1.5rem auto 3rem; padding: 0 1rem; }
  .llm-section details { background: #fff; border: 1px solid #ddd; border-radius: 10px; }
  .llm-section summary { cursor: pointer; padding: 0.8rem 1rem; font-weight: 600; font-size: 0.95rem; list-style: none; }
  .llm-section summary::-webkit-details-marker { display: none; }
  .llm-section summary::before { content: "▸ "; color: #888; }
  .llm-section details[open] summary::before { content: "▾ "; }
  .llm-body { padding: 0 1rem 1rem; }
  .llm-body .row { display: flex; align-items: center; gap: 0.6rem; margin: 0.2rem 0 0.6rem; }
  .llm-body .row span.desc { font-size: 0.83rem; color: #666; }
  .llm-body textarea { width: 100%; height: 300px; font-family: ui-monospace, Menlo, monospace; font-size: 12px; padding: 0.6rem; border: 1px solid #ccc; border-radius: 8px; background: #fafafa; }
  .copybtn { padding: 0.4em 0.9em; background: #2563eb; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
</style>
</head>
<body>
  <header>
    <a class="brand" href="/" title="トップへ"><img src="/logo.svg" alt="Tegaki Slides" /></a>
    <nav>
      <a href="/preview" class="active">作成</a>
    </nav>
    <span class="sp"></span>
    <button id="resetSel" class="tbtn">選択リセット</button>
    <button id="resetAll" class="tbtn">全リセット</button>
    <button id="save" class="tbtn">位置を保存</button>
    <button id="dl" style="padding:0.45em 1.1em;background:#2563eb;color:#fff;border:none;border-radius:8px;font-weight:600;cursor:pointer">pptx ダウンロード</button>
  </header>
  <div class="wrap">
    <div class="left">
      <textarea id="md" spellcheck="false"></textarea>
      <div class="hint">MDを編集するとリアルタイムでプレビュー。.mdファイルをドロップしても読み込めます。未登録文字は□で表示。</div>
    </div>
    <div class="right">
      <div id="fmtbar" class="fmtbar">
        <span class="fmt-label">書式:</span>
        <button id="fmtBold" class="fbtn" title="太字 **…**"><b>B</b></button>
        <span class="fmt-sep"></span>
        <span class="fmt-label">色:</span>
        <span class="fmt-colorwrap">
          <button id="fmtColorBtn" class="fbtn"><span id="fmtColorChip" class="cp-chip"></span>色 ▾</button>
          <div id="fmtColorPop" class="color-pop" style="display:none">
            <div class="cp-sec">標準の色</div>
            <div class="cp-grid" id="cpStd"></div>
            <div class="cp-sec">グレースケール</div>
            <div class="cp-grid gray" id="cpGray"></div>
            <div class="cp-foot">
              <label class="cp-custom">その他の色 <input type="color" id="fmtColor" value="#000000"></label>
              <button id="fmtClsClear" class="fbtn">色なし</button>
            </div>
          </div>
        </span>
        <span class="fmt-sep"></span>
        <span class="fmt-label">サイズ</span><span id="fmtRole" class="fmt-role">本文</span>
        <button id="fmtSizeDown" class="fbtn">−</button><span id="fmtSizeVal">–</span><button id="fmtSizeUp" class="fbtn">＋</button>
      </div>
      <div id="missingBar" class="missing-bar" style="display:none"></div>
      <div id="status"></div>
      <div id="slides"></div>
    </div>
  </div>
  <div id="qrOverlay" class="qr-overlay" style="display:none">
    <div class="qr-card">
      <h2>未登録の文字があります</h2>
      <p class="qr-missing"><span id="qrCount"></span>: <span id="qrMissingList" class="mchars"></span></p>
      <div id="qrCode" class="qr-img"></div>
      <p class="qr-help">iPad のカメラ／QRリーダーでこのコードを読み取り、手書き登録してください。<br>登録が終わったら「登録完了」を押すと再チェックします。</p>
      <p id="qrUrl" class="qr-url"></p>
      <div class="qr-btns">
        <button id="qrDone" class="qr-primary">登録完了（再チェック）</button>
        <button id="qrSkip">このまま □ で続ける</button>
      </div>
    </div>
  </div>
  <section class="llm-section">
    <details>
      <summary>AI にスライドを作らせる（記法ルールをコピー）</summary>
      <div class="llm-body">
        <div class="row">
          <span class="desc">下のテキストを ChatGPT / Claude に貼り付け、作りたい内容を伝えると、このツール用の Markdown が得られます。それを上のエディタに貼り付けてください。</span>
          <span style="flex:1"></span>
          <button class="copybtn" id="copyLlm">コピー</button>
        </div>
        <textarea id="llmSpec" readonly spellcheck="false"></textarea>
      </div>
    </details>
  </section>
  <script type="module" src="/js/preview.js?v=20260520b"></script>
</body>
</html>
