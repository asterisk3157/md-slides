<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" role="img" aria-label="md-slides">
  <defs>
    <style>
      .ink { fill: #23235a; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-weight: 600; }
      .word { font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Segoe UI", sans-serif; }
    </style>
  </defs>
  <!-- md chip -->
  <rect x="4" y="18" width="52" height="30" rx="7" fill="none" stroke="#23235a" stroke-width="2.5"/>
  <text x="30" y="39" text-anchor="middle" class="mono ink" font-size="19">md</text>
  <!-- arrow -->
  <path d="M62 33 H 92" fill="none" stroke="#23235a" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M86 28 L93 33 L86 38" fill="none" stroke="#23235a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- slide chip -->
  <rect x="100" y="16" width="70" height="34" rx="7" fill="#2563eb"/>
  <text x="135" y="39" text-anchor="middle" class="mono" font-size="17" fill="#fff">slide</text>
  <!-- wordmark -->
  <text x="186" y="33" class="word ink" font-size="23" font-weight="700">md-slides</text>
  <text x="187" y="50" class="word" font-size="12" fill="#6b6b86">Markdown をスライドに</text>
</svg>
