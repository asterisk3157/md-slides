<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文字編集 — Tegaki Slides</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <a class="brand" href="/" title="トップへ"><img src="/logo.svg" alt="Tegaki Slides" /></a>
    <a class="back-link" href="/chars">← 文字辞書へ</a>
    <h1 id="title">『 』のバリエーション</h1>
    <span class="spacer"></span>
    <a class="btn" href="/api/export" target="_blank">辞書エクスポート</a>
  </header>

  <main>
    <div class="char-page">
      <section class="variants-section">
        <div style="display:flex; align-items:center; gap:0.6rem;">
          <h2 style="margin:0;">登録済みバリエーション</h2>
          <button id="delete-char-all" class="danger" style="margin-left:auto; font-size:0.8rem;">この文字を全削除</button>
        </div>
        <div id="variants" class="variant-list"></div>
        <div id="variants-empty" style="display:none; color:#888;">
          まだバリエーションがありません。右側で書いて登録してください。
        </div>
      </section>

      <section class="pad-section">
        <h2>手書きパッド</h2>
        <div class="pad-wrap">
          <div class="ghost" id="ghost"></div>
          <canvas id="pad" width="400" height="400"></canvas>
        </div>
        <div class="pad-controls">
          <button id="undo">やり直し</button>
          <button id="clear">全消去</button>
          <button id="preview">プレビュー再生</button>
          <button id="save" class="primary">登録</button>
        </div>
        <div class="anchor-hint-only">
          <span class="anchor-hint" id="anchor-hint">数式記号 (∫ Σ √) はガイド枠に書くだけでアンカー自動設定されます。</span>
        </div>
      </section>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/js/stroke_pad.js?v=20260519f"></script>
  <script src="/js/guide_templates.js?v=20260519f"></script>
  <script src="/js/char.js?v=20260519f"></script>
</body>
</html>
