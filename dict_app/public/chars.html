<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>文字辞書 — Tegaki Slides</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <a class="brand" href="/" title="トップへ"><img src="/logo.svg" alt="Tegaki Slides" /></a>
    <nav>
      <a href="/preview">作成</a>
      <a href="/chars" class="active">文字辞書</a>
    </nav>
    <span class="stats" id="stats">読み込み中...</span>
    <span class="spacer"></span>
    <button id="add-btn">新しい文字を追加</button>
    <button id="bulk-btn" class="primary">連続登録モード</button>
    <a class="btn" href="/api/export" target="_blank">辞書エクスポート</a>
    <button id="delete-all" class="danger" title="登録済みの全文字を削除（再登録用）">全削除</button>
  </header>

  <!-- 連続登録モード セット選択モーダル -->
  <div id="bulk-modal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <h2>連続登録モード — 文字セット選択</h2>
      <p class="modal-desc">登録したい文字セットを選び、目標バリエーション数を決めて開始してください。複数選択可。</p>
      <div id="preset-list" class="preset-list"></div>
      <div class="modal-row">
        <label>カスタム文字列:
          <input id="custom-chars" type="text" placeholder="ここに登録したい文字を貼り付け" />
        </label>
      </div>
      <div class="modal-row">
        <label>目標バリエーション数:
          <input id="target-num" type="number" min="1" max="20" value="1" />
        </label>
      </div>
      <div class="modal-actions">
        <button id="bulk-cancel">キャンセル</button>
        <button id="bulk-start" class="primary">開始 →</button>
      </div>
    </div>
  </div>

  <main>
    <div class="search">
      <input id="search" type="text" placeholder="文字で絞り込み（例: あ）" />
    </div>
    <div class="char-grid" id="grid"></div>
    <div id="empty" style="display:none; color:#888; margin-top:1rem;">
      まだ何も登録されていません。「新しい文字を追加」から始めましょう。
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/js/presets.js?v=20260520a"></script>
  <script src="/js/index.js?v=20260520a"></script>
</body>
</html>
