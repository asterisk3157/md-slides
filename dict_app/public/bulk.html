<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>連続登録モード — Tegaki Slides</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header>
    <a class="brand" href="/" title="トップへ"><img src="/logo.svg" alt="Tegaki Slides" /></a>
    <a class="back-link" href="/chars">← 文字辞書へ</a>
    <h1 id="title">連続登録モード</h1>
    <span class="spacer"></span>
    <span class="hint">ショートカット: Enter=登録、→=スキップ、←=戻る、u=やり直し、c=全消去、p=プレビュー</span>
  </header>

  <main>
    <section class="bulk-status">
      <div id="status-line">準備中...</div>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
    </section>

    <div class="bulk-page" id="bulk-main" style="display:none;">
      <section class="bulk-current">
        <div class="bulk-target-meta">
          <div class="bulk-target-label">いま書く文字:</div>
          <div class="bulk-target-char" id="target-char">あ</div>
          <div class="bulk-target-count" id="target-count">0 / 3 バリエーション</div>
        </div>
        <div class="pad-wrap big">
          <div class="ghost" id="ghost"></div>
          <canvas id="pad" width="400" height="400"></canvas>
        </div>
        <div class="pad-controls bulk-controls">
          <button id="save" class="primary save-big" title="Enter">登録して次へ</button>
          <div class="pad-controls-right">
            <button id="undo" title="u">やり直し</button>
            <button id="clear" title="c">全消去</button>
            <button id="preview" title="p">プレビュー</button>
            <button id="back" title="←">← 戻る</button>
            <button id="skip" title="→">スキップ →</button>
          </div>
        </div>
        <!-- 数式記号 (∫ Σ √) はガイド枠に書くだけで anchors 自動設定 -->

      </section>

      <aside class="bulk-side">
        <h3>この文字の既存バリエーション</h3>
        <div id="existing-variants" class="variant-list"></div>
        <div id="existing-empty" style="display:none;color:#888;">まだありません</div>
      </aside>
    </div>

    <div id="done-screen" class="done-screen" style="display:none;">
      <h2>登録完了</h2>
      <p id="done-msg"></p>
      <div class="done-actions">
        <a class="btn" href="/chars">文字辞書へ戻る</a>
        <a class="btn" href="/preview">スライド作成へ</a>
        <button id="raise-target" class="primary">目標を +1 してもう一周</button>
      </div>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="/js/stroke_pad.js?v=20260519f"></script>
  <script src="/js/presets.js?v=20260519f"></script>
  <script src="/js/guide_templates.js?v=20260519f"></script>
  <script src="/js/bulk.js?v=20260519f"></script>
</body>
</html>
